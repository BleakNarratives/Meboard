name: add latch ghost

# One-shot: patch the CLI, typecheck it, and only then commit. If tsc fails,
# the step aborts and nothing is pushed.

on:
  push:
    paths:
      - .github/workflows/ghost.yml

permissions:
  contents: write

jobs:
  ghost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latch-devices

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Patch the CLI
        run: |
          python3 .github/ghost.py

      - name: Typecheck before anything is committed
        run: |
          bunx tsc -b

      - name: Commit if it compiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/latch/cli.ts
          git commit -m "Add a hidden latch ghost command"
          git push

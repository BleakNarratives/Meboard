name: append config decision

on:
  push:
    paths:
      - .github/workflows/cfg.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/config-decision

      - name: Append, then remove this scaffold in the same commit
        run: |
          set -e
          if grep -q "Where configuration lives" integrations.md; then
            echo "already appended"
          else
            cat .github/config-append.txt >> integrations.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/config-append.txt .github/workflows/cfg.yml
          git add integrations.md
          git commit -m "Record where configuration and secrets live"
          git push
          echo "--- tail of integrations.md ---"
          tail -6 integrations.md

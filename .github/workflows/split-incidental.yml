name: split incidental fixes

# One-shot: branch fix/incidental from main and copy across only the files that
# were riding along in #1. Deleting this file afterwards is a separate commit.
#
# Every line inside a run: | block must stay indented. A line at column zero
# ends the block scalar and the whole file becomes invalid YAML, which GitHub
# silently refuses to run.

on:
  push:
    paths:
      - .github/workflows/split-incidental.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Branch from main with only the unrelated fixes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/incidental origin/main
          git checkout origin/feat/latch-devices -- eslint.config.js src/components/KeyboardSurface.tsx src/hooks/use-mobile.ts src/lib/persona/engine.ts src/pages/Auth.tsx
          git status --short
          git commit -m "Fix a ref read during render and the lint findings that rode along with Latch"
          git push -u origin fix/incidental

name: append MRD sections

# One-shot: MRD.txt is too big to send through the contents API in a single
# call, so the runner appends it, commits, then deletes this workflow and the
# text file it used. Do not keep either file around afterwards.

on:
  push:
    paths:
      - .github/workflows/append-mrd.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latch-devices

      - name: Append the text to MRD.txt
        run: |
          set -e
          if grep -q "WHEN THE OTP KEY IS MISSING" MRD.txt; then
            echo "already appended, leaving MRD.txt alone"
          else
            cat .github/mrd-append.txt >> MRD.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MRD.txt
          if git diff --cached --quiet; then
            echo "MRD.txt unchanged"
          else
            git commit -m "Record the missing-OTP-key rig and demo notes in MRD.txt"
            git push
          fi

      - name: Remove this workflow and its text file
        run: |
          set -e
          git rm -f .github/workflows/append-mrd.yml .github/mrd-append.txt
          git commit -m "Remove the one-shot MRD workflow and its text file"
          git push

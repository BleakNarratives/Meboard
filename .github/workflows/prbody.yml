name: rewrite pr body

# One-shot. Scaffold deleted in the next commit.

on:
  push:
    paths:
      - .github/workflows/prbody.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit 1 --repo BleakNarratives/Meboard --body-file .github/pr1-body.md
          echo "--- first lines now on the PR ---"
          gh pr view 1 --repo BleakNarratives/Meboard --json body -q .body | head -12
